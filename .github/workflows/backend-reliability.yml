name: Backend Reliability Checks

on:
  schedule:
    - cron: "0 3 * * 1"
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chaos:
    name: Weekly chaos resilience tests
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 3 * * 1'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run chaos resilience tests
        run: pnpm run test:chaos:unit

  database-consistency:
    name: Hourly production database integrity check
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.schedule == '0 * * * *' && vars.PRODUCTION_DATABASE_CHECK_ENABLED == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require production database configuration
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Configure the PRODUCTION_DATABASE_URL repository secret for hourly integrity checks."
            exit 1
          fi

      - name: Run database consistency checks
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          DB_SSL: "true"
        run: pnpm run db:consistency

  incident-review:
    name: Create incident review issue on failure
    if: always() && (needs.chaos.result == 'failure' || needs.database-consistency.result == 'failure')
    needs: [chaos, database-consistency]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open incident review issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHAOS_RESULT: ${{ needs.chaos.result }}
          DATABASE_RESULT: ${{ needs.database-consistency.result }}
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Backend reliability check failure (run $GITHUB_RUN_ID)" \
            --body "A scheduled backend reliability check failed and needs incident review.

          - Chaos tests: $CHAOS_RESULT
          - Database consistency: $DATABASE_RESULT
          - Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
