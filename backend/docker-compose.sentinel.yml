services:
  redis-master:
    image: redis:7-alpine
    container_name: arbitra_redis_master
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'

  redis-replica:
    image: redis:7-alpine
    container_name: arbitra_redis_replica
    command: redis-server --appendonly yes --replicaof redis-master 6379
    depends_on:
      - redis-master

  sentinel-1:
    image: redis:7-alpine
    container_name: arbitra_sentinel_1
    command: >-
      sh -c "printf 'port 26379\nsentinel monitor arbitra-primary redis-master 6379 2\nsentinel down-after-milliseconds arbitra-primary 5000\nsentinel failover-timeout arbitra-primary 30000\nsentinel parallel-syncs arbitra-primary 1\n' > /etc/redis/sentinel.conf && redis-server /etc/redis/sentinel.conf --sentinel"
    ports:
      - '26379:26379'
    depends_on:
      - redis-master

  sentinel-2:
    image: redis:7-alpine
    container_name: arbitra_sentinel_2
    command: >-
      sh -c "printf 'port 26379\nsentinel monitor arbitra-primary redis-master 6379 2\nsentinel down-after-milliseconds arbitra-primary 5000\nsentinel failover-timeout arbitra-primary 30000\nsentinel parallel-syncs arbitra-primary 1\n' > /etc/redis/sentinel.conf && redis-server /etc/redis/sentinel.conf --sentinel"
    ports:
      - '26380:26379'
    depends_on:
      - redis-master

  sentinel-3:
    image: redis:7-alpine
    container_name: arbitra_sentinel_3
    command: >-
      sh -c "printf 'port 26379\nsentinel monitor arbitra-primary redis-master 6379 2\nsentinel down-after-milliseconds arbitra-primary 5000\nsentinel failover-timeout arbitra-primary 30000\nsentinel parallel-syncs arbitra-primary 1\n' > /etc/redis/sentinel.conf && redis-server /etc/redis/sentinel.conf --sentinel"
    ports:
      - '26381:26379'
    depends_on:
      - redis-master
