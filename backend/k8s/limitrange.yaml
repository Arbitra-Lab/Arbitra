apiVersion: v1
kind: LimitRange
metadata:
  name: arbitra-backend-limits
  namespace: production
  labels:
    app: arbitra-backend
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 128Mi
      default:
        cpu: 1000m
        memory: 512Mi
      min:
        cpu: 50m
        memory: 128Mi
      max:
        cpu: 1000m
        memory: 512Mi
