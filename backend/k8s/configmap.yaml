apiVersion: v1
kind: ConfigMap
metadata:
  name: arbitra-backend-config
  namespace: production
  labels:
    app: arbitra-backend
data:
  db_host: "postgres.production.svc.cluster.local"
  db_port: "5432"
  db_name: "arbitra_db"
  aws_region: "us-east-1"
  aws_s3_bucket: "arbitra-production-uploads"
  backup_s3_bucket: "arbitra-backups-prod"
  backup_replica_s3_bucket: "arbitra-backups-replica-eu-west-1"
  backup_replica_region: "eu-west-1"
